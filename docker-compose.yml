services:
  api-gateway:
    build: .
    container_name: api-gateway
    ports:
      - "${SERVER_PORT:-8400}:${SERVER_PORT:-8400}"
    env_file:
      - .ENV
    environment:
      - SERVER_PORT=${SERVER_PORT:-8400}
      - SPRING_APPLICATION_NAME=${SPRING_APPLICATION_NAME:-api-gateway}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - JAVA_BACKEND_URI=${JAVA_BACKEND_URI:-http://host.docker.internal:8401}
      - PYTHON_AI_URI=${PYTHON_AI_URI:-http://host.docker.internal:8402}
      - JWT_SECRET=${JWT_SECRET:-Unisage_Enterprise_Assistant_Authentication_Secret_Key}
      - INTERNAL_SECRET_KEY=${INTERNAL_SECRET_KEY:-unisage-internal-secret-key-2026}
